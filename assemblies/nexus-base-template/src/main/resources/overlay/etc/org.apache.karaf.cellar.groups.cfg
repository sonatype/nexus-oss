#
# This property stores the cluster groups for which the local node is member
#
groups = nexus

#
# Filtering of the bundles in the nexus cluster group
#
nexus.bundle.whitelist.inbound = *
nexus.bundle.whitelist.outbound = *
nexus.bundle.blacklist.inbound = *.xml
nexus.bundle.blacklist.outbound = *.xml

#
# Filtering of the configurations in the nexus cluster group
#
nexus.config.whitelist.inbound = *
nexus.config.whitelist.outbound = *
nexus.config.blacklist.inbound = org.apache.felix.fileinstall*, \
                                   org.apache.karaf.cellar*, \
                                   org.apache.karaf.management, \
                                   org.apache.karaf.shell, \
                                   org.ops4j.pax.logging, \
                                   org.ops4j.pax.web, \
                                   org.apache.aries.transaction
nexus.config.blacklist.outbound = org.apache.felix.fileinstall*, \
                                    org.apache.karaf.cellar*, \
                                    org.apache.karaf.management, \
                                    org.apache.karaf.shell, \
                                    org.ops4j.pax.logging, \
                                    org.ops4j.pax.web, \
                                    org.apache.aries.transaction

#
# Filtering of the features in the nexus cluster group
#
nexus.feature.whitelist.inbound = *
nexus.feature.whitelist.outbound = *
nexus.feature.blacklist.inbound = none
nexus.feature.blacklist.outbound = none

#
# The following properties define the behavior to use when the node joins the cluster (the usage of the bootstrap
# synchronizer), per cluster group and per resource.
# The following values are accepted:
# disabled: means that the synchronizer is not used, meaning the node or the cluster are not updated at all
# cluster: if the node is the first one in the cluster, it pushes its local state to the cluster, else it's not the
#       first node of the cluster, the node will update its local state with the cluster one (meaning that the cluster
#       is the master)
# node: in this case, the node is the master, it means that the cluster state will be overwritten by the node state.
#
nexus.bundle.sync = disabled
nexus.config.sync = disabled
nexus.feature.sync = disabled
nexus.obr.urls.sync = disabled
